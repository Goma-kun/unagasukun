<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="extName">うながすくん</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1 data-i18n="extName">うながすくん</h1>
    <span class="version-badge">v1.0.0</span>
    <span class="header-spacer"></span>
    <button id="btn-popout" class="header-btn" data-i18n-title="btnPopoutTip" hidden>⧉</button>
    <button id="btn-dock" class="header-btn" data-i18n-title="btnDockTip" hidden>⇥</button>
  </header>
  <div id="toast" class="toast" hidden></div>

  <main>
    <section id="today-section">
      <h2 data-i18n="todayHeading">今日の予定</h2>
      <div id="today-list" class="list"></div>
      <p id="today-empty" class="empty-note" data-i18n="todayEmpty" hidden>予定はまだありません。下の「予定を追加」から登録してください。</p>
    </section>

    <section id="edit-section">
      <h2 id="form-title" data-i18n="addHeading">予定を追加</h2>
      <form id="item-form">
        <label class="field">
          <span data-i18n="dateLabel">日付</span>
          <input type="date" id="input-date" required>
        </label>
        <div class="field time-range">
          <label>
            <span data-i18n="startLabel">開始</span>
            <input type="time" id="input-time" required>
          </label>
          <label>
            <span data-i18n="endLabel">終了（任意）</span>
            <input type="time" id="input-end-time">
          </label>
        </div>
        <p class="hint" data-i18n="endHint">終了を入れると、その間はアイコンに残り時間が出て、終わりに「できましたか？」と聞きます。</p>
        <label class="field">
          <span data-i18n="labelLabel">やること</span>
          <input type="text" id="input-label" data-i18n-placeholder="labelPlaceholder" placeholder="例：note執筆" maxlength="50" required>
        </label>
        <fieldset class="field">
          <legend data-i18n="daysLegend">繰り返し（曜日を選ぶと毎週。選ばなければ上の日付の1回だけ）</legend>
          <div class="day-row">
            <div id="day-boxes" class="day-boxes"></div>
            <button type="button" id="btn-everyday" class="chip" data-i18n="everydayBtn">毎日</button>
          </div>
        </fieldset>
        <div class="form-buttons">
          <button type="submit" id="save-btn" data-i18n="addBtn">追加する</button>
          <button type="button" id="cancel-btn" data-i18n="cancelBtn" hidden>やめる</button>
        </div>
      </form>

      <h2 data-i18n="listHeading">登録済みの予定</h2>
      <div id="item-list" class="list"></div>
      <p id="items-empty" class="empty-note" data-i18n="itemsEmpty" hidden>登録済みの予定はまだありません。</p>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
